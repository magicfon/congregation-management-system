<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>地圖分區修正</title>
<link rel="stylesheet" href="editor.css">
<header>
  <div class="row"><h1>分區修正</h1><span id="saveState" role="status">載入中…</span><button id="toolToggle" aria-expanded="false" aria-controls="editorHeaderRows" aria-label="展開或收合工具列">工具 ▼</button></div>
  <div id="editorHeaderRows">
  <div class="row">
    <select id="map" aria-label="地圖"><option value="nanzih">楠梓 1–89</option><option value="chiaotou">橋頭 90–148</option><option value="tzuguan">梓官 149–213</option></select>
    <button id="save" class="primary" disabled>儲存到雲端</button><button id="loadCloud" hidden>重新載入</button>
    <button id="restore" hidden>恢復修改</button><button id="skipRestore" hidden>保留已儲存內容</button>
    <div class="row">
    <button id="export">匯出檔案</button><label class="button">匯入檔案<input id="import" type="file" accept=".json,application/json" hidden></label>
    </div></details>
  </div>
  <div class="row tools" role="group" aria-label="編輯模式">
    <button data-mode="select" aria-pressed="true">選取</button><button data-mode="draw" aria-pressed="false">畫區塊</button><button data-mode="vertex" aria-pressed="false">頂點</button>
    <button id="deleteBlock" class="danger" hidden disabled>刪除區塊</button><button id="undo" disabled title="復原">↶</button>
    <label id="numberRow" hidden>號碼 <input id="setNumber" type="number" min="1" max="999" inputmode="numeric" style="width:4.5em" disabled><button id="applyNumber" disabled>套用</button></label>
    <button data-mode="box" aria-pressed="false">框選頂點</button>
    <button id="finishDraw" disabled>完成區塊</button><button id="cancelDraw" disabled>放棄繪製</button><button id="backPoint" disabled>退回上一點</button><button id="deleteDraftPoint" disabled>刪除選取點</button>
    <button id="clearNumber" disabled>改回自動</button>
    <button id="deleteVertex" disabled>刪除頂點</button><button id="redo" disabled>重做</button>
  </div>
  <div class="row" id="batchTools" hidden>
    <label><input id="appendVertices" type="checkbox">追加選取</label><span id="vertexCount" role="status">已選 0 點</span>
    <label>強度 <select id="smoothStrength"><option value="1">輕微</option><option value="3" selected>標準</option><option value="6">較強</option></select></label>
    <button id="smoothVertices" disabled>平滑化</button><button id="deleteVertices" class="danger" disabled>刪除所選頂點</button><button id="clearVertices" disabled>清除選取</button>
  </div>
  <div class="row">
    <button id="fit" aria-label="全圖">全圖</button><button id="focus" hidden disabled>放大選取區</button>
    <label><input id="overlay" type="checkbox" checked>色塊</label><label><input id="anchors" type="checkbox" checked>編號</label>
  </div>
  </div>
</header>
<div class="touchTools" role="toolbar" aria-label="觸控常用工具">
  <div class="touchModes"><button data-mode="pan">移動</button><button data-mode="select">選取</button><button data-mode="draw">畫區塊</button><button data-mode="vertex">頂點</button><button data-mode="box">框選</button><button id="touchNumberToggle" aria-expanded="false" aria-controls="touchNumberPanel" disabled>指定區域號碼</button><button data-action="undo">復原</button><button data-action="save" class="primary">存雲端</button></div>
  <div id="touchNumberPanel" hidden>
    <label for="touchNumber">區域號碼</label><input id="touchNumber" type="number" min="1" max="999" inputmode="numeric" placeholder="1–999" disabled>
    <button id="touchApplyNumber" class="primary" disabled>套用號碼</button><button id="touchClearNumber" disabled>改回自動</button><button id="touchNumberClose">收合</button>
  </div>
  <div id="touchDrawActions" hidden><button data-action="backPoint">退回一點</button><button data-action="deleteDraftPoint">刪選取點</button><button data-action="finishDraw" class="primary">完成區塊</button><button data-action="cancelDraw">放棄繪製</button></div>
  <div id="touchVertexActions" hidden><button data-action="deleteVertex">刪除頂點</button><button data-action="redo">重做</button></div>
  <div id="touchBoxActions" hidden><button data-action="smoothVertices">平滑化</button><button data-action="deleteVertices">刪除所選點</button><button data-action="clearVertices">清除選取</button></div>
</div>
<main>
  <p id="hint"></p>
  <p id="message" role="alert"></p>
  <svg id="mapCanvas" aria-label="可編輯分區地圖" tabindex="0"><image id="background"/><g id="regions"></g><g id="labels"></g><g id="vertices"></g><g id="cutLine"></g><g id="boxSelection"></g></svg>
  <p id="selection" aria-live="polite">尚未選取區塊</p>
</main>
<footer><span id="accessNote">修正儲存為雲端草稿，不影響正式地圖。</span><a id="login" href="/login?callbackUrl=/map/boundary-editor" target="_top" hidden>登入管理員帳號</a></footer>
<script src="vendor/polygon-clipping.js"></script><script src="geometry.js"></script><script src="editor.js"></script>
</html>
